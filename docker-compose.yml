services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical-ehr-rag
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
